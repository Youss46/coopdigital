name: PostgreSQL Integration Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  postgres-integration:
    name: RH, primes, payment, treasury, received-cheque, and sacherie concurrency protection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      RUN_POSTGRES_INTEGRATION: "1"
      POSTGRES_INTEGRATION_REFERENCE_DATE: "2026-08-29"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize disposable PostgreSQL schema
        run: pnpm --filter @workspace/db fresh-migrate

      - name: Run RH PostgreSQL integration tests
        run: pnpm --filter @workspace/api-server run test:integration:rh

      - name: Run payment, treasury, and received-cheque PostgreSQL integration tests
        run: |
          pnpm --filter @workspace/api-server run test:integration:payment-ventilation
          pnpm --filter @workspace/api-server run test:integration:treasury-transfer

      - name: Run primes concurrency PostgreSQL integration tests
        run: pnpm --filter @workspace/api-server run test:integration:primes

      - name: Run sacherie concurrency PostgreSQL integration tests
        run: pnpm --filter @workspace/api-server run test:integration:sacherie

      # The service container is disposable, but also clear it explicitly so a
      # failed test cannot leave fixtures behind if this job is ever reused.
      - name: Clean disposable PostgreSQL database
        if: always()
        run: |
          psql "$DATABASE_URL" \
            --command "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
          psql "$DATABASE_URL" \
            --command "DROP SCHEMA IF EXISTS drizzle CASCADE;"
