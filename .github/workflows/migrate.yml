name: DB Migration (Railway)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  postgres-integration:
    name: PostgreSQL integration gate
    uses: ./.github/workflows/postgres-integration.yml

  migrate:
    name: Apply schema to Railway
    needs: postgres-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vérifier couverture migrations (schema vs SQL)
        run: pnpm --filter @workspace/scripts run check-schema-coverage

      - name: Appliquer les migrations Railway (baseline + migrate)
        working-directory: lib/db
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: pnpm run ci-migrate

      - name: Vérifier date_operation sur mouvements_caisse
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          count="$(psql "$DATABASE_URL" -Atqc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'mouvements_caisse' AND column_name = 'date_operation';")"
          test "$count" = "1"
          echo "✅ mouvements_caisse.date_operation est présente en production"
